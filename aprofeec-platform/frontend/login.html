<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1e40af">
    
    <!-- APPLE TOUCH ICON -->
    <link rel="apple-touch-icon" href="/images/avatars/apu.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>APROFEEC | Connexion - Plateforme Professionnelle</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/auth.css">
    
    <style>
        /* LOGIN PAGE SPECIFIC STYLES */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(rgba(30, 58, 138, 0.9), rgba(30, 64, 175, 0.9)),
                        url('/images/backgrounds/aprb.JPG') center/cover no-repeat;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.5s ease-out;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .login-logo img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-blue);
            box-shadow: 0 10px 30px rgba(30, 64, 175, 0.3);
        }
        
        .login-title {
            font-weight: 800;
            font-size: 2.2rem;
            color: var(--dark-blue);
            margin-bottom: 5px;
        }
        
        .login-subtitle {
            color: #666;
            font-size: 1rem;
        }
        
        .welcome-message {
            text-align: center;
            margin-bottom: 30px;
            color: #444;
            font-size: 1.1rem;
        }
        
        /* Form Styles */
        .login-form .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--dark-blue);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-control {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f9fafb;
        }
        
        .form-control:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.1);
            background: white;
            outline: none;
        }
        
        /* Password Input */
        .password-wrapper {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        
        .toggle-password:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        /* Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #666;
        }
        
        .forgot-password {
            color: var(--primary-blue);
            font-weight: 500;
            text-decoration: none;
            font-size: 0.95rem;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.2);
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(30, 64, 175, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        
        .divider span {
            padding: 0 15px;
        }
        
        /* Social Login */
        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .social-btn {
            flex: 1;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            background: white;
            color: #374151;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .social-btn:hover {
            background: #f9fafb;
            border-color: #d1d5db;
            transform: translateY(-2px);
        }
        
        .social-btn.google { color: #db4437; }
        .social-btn.microsoft { color: #00a4ef; }
        
        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            color: #666;
        }
        
        .login-footer a {
            color: var(--primary-blue);
            font-weight: 600;
        }
        
        /* Error States */
        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            display: none;
        }
        
        .form-control.error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.02);
        }
        
        /* Loading State */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 58, 138, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .login-card {
                padding: 30px 25px;
                border-radius: 20px;
            }
            
            .login-title {
                font-size: 1.8rem;
            }
            
            .login-logo img {
                width: 60px;
                height: 60px;
            }
            
            .form-control {
                padding: 16px;
            }
            
            .login-btn {
                padding: 16px;
            }
            
            .social-login {
                flex-direction: column;
            }
        }
        
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 15px;
            }
            
            .login-card {
                padding: 25px 20px;
            }
            
            .login-title {
                font-size: 1.6rem;
            }
            
            .form-options {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
        
        /* Dark Mode */
        @media (prefers-color-scheme: dark) {
            .login-card {
                background: rgba(30, 30, 46, 0.95);
                color: #e0e0e0;
                border-color: rgba(255, 255, 255, 0.1);
            }
            
            .login-title {
                color: white;
            }
            
            .login-subtitle {
                color: #a0a0a0;
            }
            
            .welcome-message {
                color: #d0d0d0;
            }
            
            .form-control {
                background: #2d2d3d;
                border-color: #444;
                color: #e0e0e0;
            }
            
            .form-control:focus {
                background: #36364a;
                border-color: var(--accent-blue);
            }
            
            .social-btn {
                background: #2d2d3d;
                border-color: #444;
                color: #e0e0e0;
            }
            
            .social-btn:hover {
                background: #36364a;
            }
            
            .divider::before,
            .divider::after {
                background: #444;
            }
            
            .login-footer {
                color: #a0a0a0;
                border-color: #444;
            }
        }
        
        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .shake {
            animation: shake 0.5s;
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner" style="width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 1.2rem; font-weight: 500;">Connexion en cours...</div>
    </div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <img src="/images/avatars/apu.jpg" alt="APROFEEC" loading="lazy">
                        <div>
                            <div class="login-title">APROFEEC</div>
                            <div class="login-subtitle">AMANI KWETU II</div>
                        </div>
                    </div>
                    <p class="welcome-message">
                        Bienvenue ! Connectez-vous pour accéder à votre espace de formation.
                    </p>
                </div>
                
                <!-- Login Form -->
                <form id="loginForm" autocomplete="on">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i>
                            Adresse Email
                        </label>
                        <input type="email" 
                               id="email" 
                               class="form-control" 
                               placeholder="votre.email@exemple.com" 
                               required
                               autocomplete="email"
                               autocapitalize="none"
                               inputmode="email">
                        <div class="error-message" id="emailError">
                            <i class="fas fa-exclamation-circle"></i>
                            Veuillez entrer une adresse email valide
                        </div>
                    </div>
                    
                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i>
                            Mot de passe
                        </label>
                        <div class="password-wrapper">
                            <input type="password" 
                                   id="password" 
                                   class="form-control" 
                                   placeholder="Votre mot de passe" 
                                   required
                                   autocomplete="current-password">
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="passwordError">
                            <i class="fas fa-exclamation-circle"></i>
                            Mot de passe incorrect
                        </div>
                    </div>
                    
                    <!-- Options -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="forgot-password.html" class="forgot-password">
                            <i class="fas fa-key"></i>
                            Mot de passe oublié ?
                        </a>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Se connecter</span>
                    </button>
                    
                    <!-- Divider -->
                    <div class="divider">
                        <span>Ou connectez-vous avec</span>
                    </div>
                    
                    <!-- Social Login -->
                    <div class="social-login">
                        <button type="button" class="social-btn google" id="googleLogin">
                            <i class="fab fa-google"></i>
                            <span>Google</span>
                        </button>
                        <button type="button" class="social-btn microsoft" id="microsoftLogin">
                            <i class="fab fa-microsoft"></i>
                            <span>Microsoft</span>
                        </button>
                    </div>
                </form>
                
                <!-- Footer -->
                <div class="login-footer">
                    <p style="margin-bottom: 0;">
                        Nouveau sur APROFEEC ? 
                        <a href="register.html" style="color: var(--primary-blue); font-weight: 600;">
                            Créer un compte
                        </a>
                    </p>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #9ca3af;">
                        <a href="/" style="color: inherit; text-decoration: none;">
                            <i class="fas fa-home"></i> Retour à l'accueil
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/mobile.js"></script>
    
    <script>
        // Mobile optimized login
        document.addEventListener('DOMContentLoaded', function() {
            // Détection mobile
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            // Fix iOS 100vh
            if (isMobile) {
                function setVH() {
                    let vh = window.innerHeight * 0.01;
                    document.documentElement.style.setProperty('--vh', `${vh}px`);
                }
                setVH();
                window.addEventListener('resize', setVH);
                window.addEventListener('orientationchange', setVH);
            }
            
            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                // Mobile touch events
                togglePassword.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    this.style.transform = 'translateY(-50%) scale(0.9)';
                }, { passive: false });
                
                togglePassword.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    this.style.transform = 'translateY(-50%)';
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.innerHTML = type === 'password' ? 
                        '<i class="fas fa-eye"></i>' : 
                        '<i class="fas fa-eye-slash"></i>';
                });
                
                // Desktop click event
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.innerHTML = type === 'password' ? 
                        '<i class="fas fa-eye"></i>' : 
                        '<i class="fas fa-eye-slash"></i>';
                });
            }
            
            // Form submission
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    // Get form data
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const rememberMe = document.getElementById('rememberMe').checked;
                    
                    // Validation basique
                    let isValid = true;
                    
                    // Reset errors
                    document.querySelectorAll('.error-message').forEach(el => {
                        el.style.display = 'none';
                    });
                    document.querySelectorAll('.form-control').forEach(el => {
                        el.classList.remove('error');
                    });
                    
                    // Email validation
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        document.getElementById('emailError').style.display = 'flex';
                        document.getElementById('email').classList.add('error');
                        isValid = false;
                    }
                    
                    // Password validation
                    if (password.length < 6) {
                        document.getElementById('passwordError').textContent = 'Le mot de passe doit contenir au moins 6 caractères';
                        document.getElementById('passwordError').style.display = 'flex';
                        document.getElementById('password').classList.add('error');
                        isValid = false;
                    }
                    
                    if (!isValid) {
                        // Vibration on error (mobile)
                        if (navigator.vibrate) {
                            navigator.vibrate(200);
                        }
                        return;
                    }
                    
                    // Show loading
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
                    loadingOverlay.classList.add('active');
                    
                    try {
                        // Simulate API call (in production, replace with actual fetch)
                        const delay = isMobile ? 1500 : 2000;
                        
                        // Check if using test credentials
                        const isTestLogin = (email === 'admin@aprofeec.com' && password === 'admin123');
                        
                        setTimeout(() => {
                            if (isTestLogin) {
                                // Test login success
                                localStorage.setItem('aprofeec_token', 'test_token_' + Date.now());
                                localStorage.setItem('aprofeec_user', JSON.stringify({
                                    id: 1,
                                    firstName: 'Admin',
                                    lastName: 'APROFEEC',
                                    email: email,
                                    role: 'admin',
                                    phone: '+243000000000'
                                }));
                                
                                // Store remember me preference
                                if (rememberMe) {
                                    localStorage.setItem('rememberMe', 'true');
                                }
                                
                                // Success message
                                showNotification('✅ Connexion réussie ! Redirection...', 'success');
                                
                                // Redirect to dashboard
                                setTimeout(() => {
                                    window.location.href = '/dashboard.html';
                                }, 1000);
                            } else {
                                // In production, this would call auth.login()
                                // For now, simulate failed login
                                throw new Error('Email ou mot de passe incorrect');
                            }
                        }, delay);
                        
                    } catch (error) {
                        // Hide loading
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Se connecter</span>';
                        loadingOverlay.classList.remove('active');
                        
                        // Show error
                        document.getElementById('passwordError').textContent = error.message;
                        document.getElementById('passwordError').style.display = 'flex';
                        document.getElementById('password').classList.add('error');
                        
                        // Vibration on error (mobile)
                        if (navigator.vibrate) {
                            navigator.vibrate([200, 100, 200]);
                        }
                        
                        // Shake animation
                        loginForm.classList.add('shake');
                        setTimeout(() => {
                            loginForm.classList.remove('shake');
                        }, 500);
                    }
                });
            }
            
            // Social login buttons
            document.getElementById('googleLogin').addEventListener('click', function() {
                showNotification('⚠️ Connexion Google - Fonctionnalité à venir', 'info');
            });
            
            document.getElementById('microsoftLogin').addEventListener('click', function() {
                showNotification('⚠️ Connexion Microsoft - Fonctionnalité à venir', 'info');
            });
            
            // Check if user is already logged in
            const token = localStorage.getItem('aprofeec_token');
            if (token) {
                // Redirect to dashboard if already logged in
                window.location.href = '/dashboard.html';
            }
            
            // Auto-focus email field on mobile
            if (isMobile) {
                setTimeout(() => {
                    document.getElementById('email').focus();
                }, 500);
            }
            
            // Load remember me preference
            const rememberMe = localStorage.getItem('rememberMe');
            if (rememberMe === 'true') {
                document.getElementById('rememberMe').checked = true;
                // You could also auto-fill email if stored securely
            }
            
            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !loginBtn.disabled) {
                    // Already handled by form submit
                }
                
                // Ctrl+K to focus search (global)
                if (e.ctrlKey && e.key === 'k') {
                    e.preventDefault();
                    document.getElementById('email').focus();
                }
            });
            
            // Network detection
            window.addEventListener('offline', function() {
                showNotification('⚠️ Vous êtes hors ligne. Connexion locale activée.', 'warning');
            });
            
            // Function to show notification
            function showNotification(message, type = 'info') {
                // Remove existing notifications
                document.querySelectorAll('.notification').forEach(el => el.remove());
                
                const notification = document.createElement('div');
                notification.className = `notification notification-${type}`;
                notification.innerHTML = `
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                `;
                
                // Style the notification
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 50%;
                    transform: translateX(-50%) translateY(-100px);
                    background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6'};
                    color: white;
                    padding: 15px 25px;
                    border-radius: 12px;
                    font-weight: 500;
                    z-index: 9999;
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                    transition: transform 0.3s ease;
                `;
                
                document.body.appendChild(notification);
                
                // Animate in
                setTimeout(() => {
                    notification.style.transform = 'translateX(-50%) translateY(0)';
                }, 10);
                
                // Remove after 5 seconds
                setTimeout(() => {
                    notification.style.transform = 'translateX(-50%) translateY(-100px)';
                    setTimeout(() => {
                        if (document.body.contains(notification)) {
                            document.body.removeChild(notification);
                        }
                    }, 300);
                }, 5000);
            }
            
            // Demo credentials for testing
            function showDemoCredentials() {
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    const demoBanner = document.createElement('div');
                    demoBanner.style.cssText = `
                        position: fixed;
                        bottom: 20px;
                        left: 20px;
                        right: 20px;
                        background: rgba(59, 130, 246, 0.9);
                        color: white;
                        padding: 15px;
                        border-radius: 12px;
                        font-size: 0.9rem;
                        z-index: 1000;
                        backdrop-filter: blur(10px);
                        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                    `;
                    demoBanner.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong><i class="fas fa-key"></i> Identifiants de test :</strong>
                                <div style="margin-top: 5px;">
                                    Email: <code>admin@aprofeec.com</code><br>
                                    Mot de passe: <code>admin123</code>
                                </div>
                            </div>
                            <button id="closeDemo" style="background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer;">×</button>
                        </div>
                    `;
                    
                    document.body.appendChild(demoBanner);
                    
                    document.getElementById('closeDemo').addEventListener('click', function() {
                        document.body.removeChild(demoBanner);
                    });
                    
                    // Auto-remove after 30 seconds
                    setTimeout(() => {
                        if (document.body.contains(demoBanner)) {
                            document.body.removeChild(demoBanner);
                        }
                    }, 30000);
                }
            }
            
            // Show demo credentials on localhost
            showDemoCredentials();
        });

        // Spin animation for loading
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
